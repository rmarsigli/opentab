[package]
name = "opentab-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "opentab-mcp"
path = "src/main.rs"

[features]
live = ["opentab-audio/live"]

[dependencies]
opentab-audio = { path = "../opentab-audio" }
opentab-playback = { path = "../opentab-playback" }
opentab-model = { path = "../opentab-model" }
opentab-command = { path = "../opentab-command" }
opentab-gp = { path = "../opentab-gp" }
opentab-files = { path = "../opentab-files" }
opentab-layout = { path = "../opentab-layout" }
opentab-render = { path = "../opentab-render" }
rmcp.workspace = true
tokio = { workspace = true, features = ["io-util", "io-std", "sync", "macros"] }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true

[dev-dependencies]
opentab-testkit = { path = "../opentab-testkit" }
tempfile.workspace = true
resvg.workspace = true
hound.workspace = true
midly.workspace = true
sha2.workspace = true

[lints]
workspace = true
