[workspace]
resolver = "3"
members = [
    "crates/opentab-model",
    "crates/opentab-testkit",
    "crates/opentab-command",
    "crates/opentab-cli",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-rational = { version = "0.4", features = ["serde"] }
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
