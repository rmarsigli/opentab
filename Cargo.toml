[workspace]
resolver = "3"
members = [
    "crates/opentab-model",
    "crates/opentab-testkit",
    "crates/opentab-command",
    "crates/opentab-cli",
    "crates/opentab-gp",
    "crates/opentab-layout",
    "crates/opentab-render",
    "xtask",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
num-rational = { version = "0.4", default-features = false, features = ["serde"] }
thiserror = "2"
proptest = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
toml = "0.8"
tempfile = "3"
base64 = "0.22"
quick-xml = "0.42"
zip = { version = "8.6", default-features = false, features = ["deflate-flate2"] }
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
resvg = { version = "0.48.1", default-features = false }
insta = { version = "1.49.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
